name: Review prompt build check
on:
  push:
    branches: [review-prompt]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          xcodebuild -version
      - name: List
        run: xcodebuild -list -project AudioBubble.xcodeproj
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project AudioBubble.xcodeproj -scheme AudioBubble \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
      - name: Warnings in touched files
        if: always()
        run: grep -nE "warning:.*(ReviewPrompter|AppModel|AudioBubbleApp)\.swift" build.log || echo "No warnings in touched files"
