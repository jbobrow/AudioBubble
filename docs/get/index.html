<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Get Audio Bubble</title>
  <meta name="description" content="Hear the people you're with, clearly and instantly, even in loud places. Get Audio Bubble for iPhone.">
  <meta property="og:title" content="Get Audio Bubble">
  <meta property="og:description" content="Hear the people you're with, clearly and instantly, even in loud places.">
  <!-- Share image, rendered from og/og-image.html -->
  <meta property="og:image" content="https://audiobubble.jonbobrow.com/og-image.png">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="Audio Bubble: Hear the people you’re with, even in loud places. An iPhone showing friends gathered in a bubble.">
  <!-- Share video, recorded from og/og-video.html by og/render-video.sh; Messages plays it in place of the image -->
  <meta property="og:video" content="https://audiobubble.jonbobrow.com/og-video.mp4?v=1">
  <meta property="og:video:secure_url" content="https://audiobubble.jonbobrow.com/og-video.mp4?v=1">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1200">
  <meta property="og:video:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://audiobubble.jonbobrow.com/og-image.png">
  <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <script>
    // Where the QR code in the app and "Send the link" lead. Once Audio Bubble is on the App
    // Store, put its ID here (the number in https://apps.apple.com/app/id1234567890), and
    // iPhones go straight to it.
    const appStoreID = null;

    const appStoreURL = appStoreID ? `https://apps.apple.com/app/id${appStoreID}` : null;
    const ua = navigator.userAgent;
    // iPadOS reports itself as a Mac, so a Mac with a touchscreen is an iPad.
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    if (appStoreURL && isIOS) location.replace(appStoreURL);
  </script>
</head>
<body>
  <main class="page get">
    <header>
      <picture>
        <source srcset="../icon-dark.png" media="(prefers-color-scheme: dark)">
        <img class="app-icon" src="../icon.png" width="256" height="256" alt="">
      </picture>
      <h1>Audio Bubble</h1>
      <p class="tagline">Hear the people you're with, even in loud places.</p>
    </header>

    <p class="get-note" id="note">Get Audio Bubble, put in your headphones and open it. You'll
      appear on your friend's screen, and they can invite you into their bubble.</p>

    <a class="download" id="download" hidden>Download on the App Store</a>
    <span class="download soon" id="soon">Coming soon to iPhone</span>

    <nav class="footer-links" aria-label="Footer links">
      <a href="../">About Audio Bubble</a>
      <a href="../support/">Support</a>
    </nav>
  </main>
  <script>
    const note = document.getElementById("note");
    if (isAndroid) {
      note.textContent = "Audio Bubble is only on iPhone for now, so joining the bubble takes an iPhone.";
    } else if (!isIOS) {
      note.textContent = "Audio Bubble is for iPhone. Open this page on your iPhone to get it.";
    }
    if (appStoreURL && !isAndroid) {
      const download = document.getElementById("download");
      download.href = appStoreURL;
      download.hidden = false;
      document.getElementById("soon").hidden = true;
    }
  </script>
</body>
</html>
